const t=k=>T[lang][k];

function renderMenu(){
 $("tabs").innerHTML=CATS.map(c=>`<a href="#c-${c[0]}">${c[1]} ${lang=="ru"?c[2]:c[3]}</a>`).join("");
 $("menu").innerHTML=CATS.map(c=>`<h2 id="c-${c[0]}">${lang=="ru"?c[2]:c[3]}</h2><div class="grid">`+M.filter(m=>m.c==c[0]).map(m=>`
 <div class="card"><div class="pic" style="background:${c[4]}">${m.e}</div><div class="info">
 <div class="nm">${m[lang]}</div><div class="ds">${lang=="ru"?m.dr:m.dk}</div>
 <div class="row"><span class="pr">${fmt(m.p)}</span><span data-slot="${m.id}"></span></div></div></div>`).join("")+`</div>`).join("");
 slots();
}
function slots(){
 document.querySelectorAll("[data-slot]").forEach(s=>{
  const id=s.dataset.slot,q=cart[id]||0;
  s.innerHTML=q?`<div class="qty"><button data-d="-1" data-id="${id}" aria-label="−">−</button><b>${q}</b><button data-d="1" data-id="${id}" aria-label="+">+</button></div>`:`<button class="add" data-d="1" data-id="${id}">${t("add")}</button>`;
 });
}
function calc(){
 let sub=0,n=0;for(const id in cart){sub+=M[id].p*cart[id];n+=cart[id]}
 const del=!n?0:sub>=FREE?0:FEE,tot=sub+del;
 return{sub,n,del,tot};
}
function renderCart(){
 const {sub,n,del,tot}=calc();
 $("cnt").textContent=n;$("bt").textContent=fmt(tot);$("bot").classList.toggle("show",n>0);
 $("items").innerHTML=n?Object.keys(cart).map(id=>{const m=M[id],q=cart[id];return `<div class="it"><div class="e">${m.e}</div><div class="t">${m[lang]}<small>${fmt(m.p)} × ${q} = ${fmt(m.p*q)}</small></div><div class="qty"><button data-d="-1" data-id="${id}">−</button><b>${q}</b><button data-d="1" data-id="${id}">+</button></div></div>`}).join(""):`<div class="empty"><div>🛒</div>${t("empty")}</div>`;
 $("s1").textContent=fmt(sub);$("s2").textContent=n?(del?fmt(del):t("free0")):fmt(0);$("s3").textContent=fmt(tot);
 $("barf").style.width=Math.min(100,sub/FREE*100)+"%";
 $("free").textContent=!n?"":sub>=FREE?t("freeok"):t("more")(FREE-sub);
 $("buy").disabled=!n;
 slots();save();
}
function change(id,d){const q=(cart[id]||0)+d;if(q<=0)delete cart[id];else cart[id]=Math.min(q,50);renderCart()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(b)change(b.dataset.id,+b.dataset.d)});
const dr=(on)=>{$("dr").classList.toggle("on",on);$("ov").classList.toggle("on",on)};
["open","open2"].forEach(i=>$(i).onclick=()=>dr(true));$("close").onclick=$("ov").onclick=()=>dr(false);
$("go").onclick=()=>$("c-burger").scrollIntoView();
$("buy").onclick=()=>{
 const {sub,del,tot}=calc();
 let m=t("hi")+"\n\n"+Object.keys(cart).map(id=>`• ${M[id][lang]} × ${cart[id]} — ${fmt(M[id].p*cart[id])}`).join("\n");
 m+=`\n\n${t("dl")}: ${del?fmt(del):t("free0")}\n${t("it")}: ${fmt(tot)}`;
 if($("nm").value.trim())m+=`\n\n${t("n")}: ${$("nm").value.trim()}`;
 if($("ad").value.trim())m+=`\n${t("a")}: ${$("ad").value.trim()}`;
 if($("cm").value.trim())m+=`\n${t("c")}: ${$("cm").value.trim()}`;
 window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(m)}`,"_blank");
};
function setLang(l){
 lang=l;document.documentElement.lang=l=="kk"?"kk":"ru";
 $("lru").classList.toggle("on",l=="ru");$("lkk").classList.toggle("on",l=="kk");
 document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
 document.querySelectorAll("[data-p]").forEach(el=>el.placeholder=t(el.dataset.p));
 document.title="Rayana — "+(l=="ru"?"доставка еды":"тағам жеткізу");
 renderMenu();renderCart();
}
$("lru").onclick=()=>setLang("ru");$("lkk").onclick=()=>setLang("kk");
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#"+e.target.id))}),{rootMargin:"-140px 0px -70% 0px"});
setLang(lang);document.querySelectorAll("h2[id]").forEach(h=>io.observe(h));
document.getElementById("lru").addEventListener("click",()=>setTimeout(()=>document.querySelectorAll("h2[id]").forEach(h=>io.observe(h))));
document.getElementById("lkk").addEventListener("click",()=>setTimeout(()=>document.querySelectorAll("h2[id]").forEach(h=>io.observe(h))));
</script>
</body>
</html>
